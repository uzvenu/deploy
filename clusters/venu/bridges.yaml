# Links between this standalone venu cluster and the legacy cluster, applied by
# hand (kubectl apply) like the Applications. Remove each piece once the thing
# on the other side has moved or stopped needing it.
#
# 1. The Codex image service stays on the legacy cluster (it needs host
#    AppArmor/seccomp provisioning). Latta Putta's API keeps its in-cluster URL
#    http://codex-image-service.agent.svc.cluster.local:8091. Netbird drops
#    forwarded NodePort traffic between the hosts, so the host service
#    venu-cluster-bridge.service (an SSH local forward restricted to that one
#    ClusterIP on the control plane) listens on the k3d bridge gateway.
apiVersion: v1
kind: Service
metadata:
  name: codex-image-service
  namespace: agent
  labels:
    app.kubernetes.io/part-of: cluster-bridge
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8091
      targetPort: 18091
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: codex-image-service-legacy
  namespace: agent
  labels:
    kubernetes.io/service-name: codex-image-service
    app.kubernetes.io/part-of: cluster-bridge
addressType: IPv4
ports:
  - name: http
    port: 18091
    protocol: TCP
endpoints:
  - addresses: ["172.30.0.1"]
    conditions:
      ready: true
---
# 2. Motiv and Rocketpark (legacy cluster) read Latta Putta's catalog from
#    venu-api.venu.svc. The legacy side resolves that name to this NodePort,
#    which k3d publishes on the host's netbird address (100.100.141.147:31080).
apiVersion: v1
kind: Service
metadata:
  name: venu-api-legacy-bridge
  namespace: venu
  labels:
    app.kubernetes.io/part-of: cluster-bridge
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: venu-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
