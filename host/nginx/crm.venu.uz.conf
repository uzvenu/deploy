# CRM-only host proxy; Kubernetes resources are managed by GitOps.
server {
    listen 80;
    listen [::]:80;
    server_name crm.venu.uz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/crm-acme; }
    location / { return 301 https://crm.venu.uz$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crm.venu.uz;
    ssl_certificate /etc/letsencrypt/live/crm.venu.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.venu.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / {
        proxy_pass http://127.0.0.1:30025;
        proxy_http_version 1.1;
        proxy_set_header Host crm.venu.uz;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 16m;
    }
}
