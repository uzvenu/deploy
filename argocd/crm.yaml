apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crm
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: venu-crm
spec:
  project: default
  sources:
    - repoURL: https://github.com/uzvenu/deploy.git
      targetRevision: master
      path: charts/crm
      helm:
        releaseName: crm
        valueFiles:
          - $values/helm/crm-values.yaml
        parameters:
          - name: route.hostname
            value: crm.venu.uz
    - repoURL: https://github.com/uzvenu/backend.git
      targetRevision: master
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: venu-crm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m
        factor: 2
