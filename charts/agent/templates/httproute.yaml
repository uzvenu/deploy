{{- if and .Values.enabled .Values.route.enabled .Values.legacyAgent.enabled }}
# lattaputta.iprogrammer.uz — Lattaputta chatboti (sayt widgeti + Meta webhook'lari).
# Xost nginx TLS'ni yopadi va default/main-gateway ga uzatadi.
#
# Venu agenti alohida host olmaydi: u venu-api.iprogrammer.uz/ai/* orqali keladi,
# u yerdagi HTTPRoute venu ns'da turadi va shu ns'dagi servisga referencegrant.yaml
# bilan ruxsat oladi.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.route.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  hostnames:
    - {{ .Values.route.hostname }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.legacyAgent.name }}
          port: 8080
          weight: 1
{{- end }}
