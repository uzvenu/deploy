{{- if and .Values.enabled .Values.networkPolicy.enabled .Values.postgres.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.postgres.name }}-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.postgres.name }}
  policyTypes:
    - Ingress
  # This cluster's CNI rejects even same-namespace podSelector peers. Database
  # credentials remain per-brand; network isolation needs a tested default-deny.
  ingress:
    - {}
{{- end }}
{{- if and .Values.enabled .Values.networkPolicy.enabled .Values.modernAgent.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.modernAgent.name }}-ingress
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.modernAgent.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.apiNamespace }}
      ports:
        - protocol: TCP
          port: 8090
{{- end }}
