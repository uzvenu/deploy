{{- if and .Values.enabled .Values.outreach.enabled }}
# Backend admin kampaniyalaridagi Telegram/Instagram text, voice va video delivery worker.
# Consent, scheduling, quota va status backend source-of-truth'ida boshqariladi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.outreach.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.outreach.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.outreach.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.outreach.name }}
        app.kubernetes.io/part-of: {{ .Values.partOf }}
    spec:
      {{- with .Values.outreach.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.outreach.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: {{ .Values.registrySecretName }}

      containers:
        - name: outreach
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/app/outreach"]
          args: ["-config", "/app/configs/config.yaml"]
          envFrom:
            - secretRef:
                name: {{ .Values.outreach.secretName }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
{{- end }}
