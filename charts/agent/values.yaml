# Defaults for the shared agent chart.
#
# Same rule as charts/marketplace: a default is only allowed when it is the same
# for every brand. Anything that identifies one brand has no default and is
# declared in templates/validate.yaml, so a brand that forgets it fails the
# render instead of quietly inheriting somebody else's.
#
# This chart used to default to Latta Putta's production — down to its Telegram
# alert chat id, which meant a brand that enabled the legacy agent without
# setting alertChatID would have started sending its alerts into Latta Putta's
# chat.
#
# Note this chart is not yet brand-neutral in shape: its templates are still
# named per brand (lattaputta-agent.yaml, venu-agent.yaml, ...) rather than
# rendered once from values. Folding them together is separate work; the two
# agents share an image but genuinely differ in modes, auth and probes.

enabled: true

# --- required per brand, no defaults -----------------------------------------
#
# partOf                 the brand that owns every resource
# registrySecretName     image pull Secret in this brand's namespace
# <agent>.secretName     the enabled agent's environment Secret
# postgres.secretName    this brand's own database credentials
# route.hostname         the public agent hostname, when route.enabled
# networkPolicy.apiNamespace  the namespace whose API may reach this agent

# Optional: a Secret holding a Google service account key, mounted when set.
googleCredentialsSecretName: ""

# Same image for every brand. CD overwrites the tag with the commit SHA.
image:
  repository: registry.iprogrammer.uz/venu/agent
  tag: bootstrap

# The agent talking to the current Go backend.
modernAgent:
  enabled: false
  name: agent
  modes: http
  alertChatID: ""
  alertSource: ""

# The agent talking to the legacy 6Valley API. A brand with no legacy system
# leaves this off.
legacyAgent:
  enabled: false
  name: legacy-agent
  alertChatID: ""
  alertSource: ""

sellerAgent:
  # Needs a control API token and at least one account before it can run.
  enabled: false

outreach:
  enabled: false
  name: outreach

partnerReminders:
  enabled: false
  name: partner-reminders

postgres:
  enabled: true
  name: postgres
  serviceName: postgres
  dataClaimName: postgres-data
  initConfigMapName: postgres-init
  storageClassName: local-path
  storageSize: 10Gi
  # One database per agent that needs one.
  databases: []

route:
  enabled: false
  name: agent
  gatewayName: main-gateway
  gatewayNamespace: default

networkPolicy:
  enabled: true
