{{- if and .Values.enabled .Values.imageServiceApplication.enabled }}
{{- if ne .Release.Namespace "venu" }}
{{- fail "imageServiceApplication is restricted to the Latta Putta root in namespace venu" }}
{{- end }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: codex-image-service
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    app.kubernetes.io/part-of: lattaputta-agent
spec:
  project: default
  sources:
    - repoURL: https://github.com/uzvenu/deploy.git
      targetRevision: master
      path: charts/image-service
      helm:
        releaseName: codex-image-service
        valueFiles:
          - $values/helm/lattaputta-image-service-values.yaml
    - repoURL: https://github.com/uzvenu/chatbot.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: agent
  syncPolicy:
    {{- if .Values.imageServiceApplication.autoSync }}
    automated:
      prune: true
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        maxDuration: 3m
        factor: 2
{{- end }}
