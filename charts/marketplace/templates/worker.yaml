{{- if and .Values.enabled .Values.worker.enabled }}
# Venu worker — background jobs (cmd/worker). Same image as the API, runs the
# worker binary instead. Separate Deployment so it scales independently and a
# slow job never starves an HTTP request. No HTTP port, no JWT keys needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.worker.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.worker.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.worker.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.worker.name }}
        app.kubernetes.io/part-of: {{ .Values.partOf }}
      # The worker serves /metrics on :9090 (job counters + Go runtime). The
      # port is never exposed via Service/HTTPRoute — cluster-internal only.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
        - name: {{ .Values.registrySecretName }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/app/worker"]
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - secretRef:
                name: {{ .Values.api.secretName }}
{{- if .Values.api.virtualTryOnSecretName }}
            - secretRef:
                name: {{ .Values.api.virtualTryOnSecretName }}
{{- end }}
          volumeMounts:
            - name: storage
              mountPath: /app/storage
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: storage
{{ if .Values.api.storageClaimName }}
          persistentVolumeClaim:
            claimName: {{ .Values.api.storageClaimName }}
{{ else }}
          emptyDir: {}
{{ end }}
{{- end }}
