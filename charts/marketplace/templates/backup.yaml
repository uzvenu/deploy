{{- if and .Values.enabled .Values.backup.enabled }}
# Nightly logical backup of the Venu Postgres.
#
# pg_dump -Fc (custom format) into its own PVC, one file per day, 7 days kept.
# Credentials come from the same venu-postgres Secret the database itself uses
# (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB) — nothing is duplicated and
# nothing lives in git.
#
# Restore procedure and the restore drill live in docs/OPERATIONS.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.backup.claimName }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    app.kubernetes.io/name: {{ .Values.backup.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.backup.storageClassName }}
  resources:
    requests:
      # 7 daily -Fc dumps of a 10Gi database compress well; revisit when a
      # single dump approaches 1Gi.
      storage: {{ .Values.backup.storageSize }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.backup.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.backup.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  # 22:00 UTC = 03:00 Asia/Tashkent. Written in UTC on purpose: spec.timeZone
  # needs Kubernetes >= 1.27 and buys nothing here.
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .Values.backup.name }}
            app.kubernetes.io/part-of: {{ .Values.partOf }}
        spec:
          restartPolicy: Never
          containers:
            - name: pg-dump
              # Same major version as the server in postgres.yaml — pg_dump
              # must not be older than the server it dumps.
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: {{ .Values.postgres.secretName }}
              command:
                - /bin/sh
                - -ec
                - |
                  export PGPASSWORD="$POSTGRES_PASSWORD"
                  out="/backups/{{ .Values.backup.filePrefix }}-$(date +%Y-%m-%d).dump"
                  echo "dumping to $out"
                  pg_dump -h {{ default .Values.postgres.serviceName .Values.postgres.externalHost | quote }} -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc -f "$out"
                  echo "dump done: $(du -h "$out" | cut -f1)"
{{- if .Values.storage.enabled }}
                  media="/backups/{{ .Values.backup.filePrefix }}-media-$(date +%Y-%m-%d).tar.gz"
                  tar -czf "$media" -C /storage .
                  echo "media backup done: $(du -h "$media" | cut -f1)"
{{- end }}
                  find /backups -name '{{ .Values.backup.filePrefix }}-*.dump' -mtime +{{ .Values.backup.retentionDays }} -delete
                  find /backups -name '{{ .Values.backup.filePrefix }}-media-*.tar.gz' -mtime +{{ .Values.backup.retentionDays }} -delete
                  echo "kept:"; ls -lh /backups
              volumeMounts:
                - name: backups
                  mountPath: /backups
{{- if .Values.storage.enabled }}
                - name: storage
                  mountPath: /storage
                  readOnly: true
{{- end }}
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: {{ .Values.backup.claimName }}
{{- if .Values.storage.enabled }}
            - name: storage
              persistentVolumeClaim:
                claimName: {{ .Values.storage.claimName }}
{{- end }}
{{- end }}
