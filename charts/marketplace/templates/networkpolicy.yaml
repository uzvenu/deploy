{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.postgres.name }}-ingress
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.postgres.name }}
  policyTypes:
    - Ingress
  # This cluster's CNI rejects even same-namespace podSelector peers. Keep the
  # policy open until namespace default-deny is implemented and tested end-to-end.
  ingress:
    - {}
{{- end }}
