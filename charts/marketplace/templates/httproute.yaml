{{- if and .Values.enabled .Values.route.enabled }}
# Routes venu-api.iprogrammer.uz through the shared cluster gateway
# (default/main-gateway, nginx Gateway API). The host nginx LB terminates TLS and
# proxies to the gateway NodePort.
#
# Only the authenticated backend is public. It calls the agent over the
# cluster-internal Service; exposing the agent directly would bypass customer auth.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.route.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  hostnames:
    - {{ .Values.route.hostname }}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Values.api.name }}
          port: 8080
          weight: 1
{{- end }}
