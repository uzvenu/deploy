{{- if .Values.partnerReminders.enabled }}
# Backend admin jadvali bo'yicha hamkor chatlariga text eslatma yuboruvchi alohida Telegram bot worker.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lattaputta-partner-reminders
  labels:
    app.kubernetes.io/name: lattaputta-partner-reminders
    app.kubernetes.io/part-of: agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lattaputta-partner-reminders
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lattaputta-partner-reminders
        app.kubernetes.io/part-of: agents
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: venu-registry
      containers:
        - name: partner-reminders
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/app/partner-reminders"]
          envFrom:
            - secretRef:
                name: lattaputta-partner-reminder-env
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
{{- end }}
