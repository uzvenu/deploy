# Backend admin kampaniyalaridagi Telegram/Instagram text, voice va video delivery worker.
# Consent, scheduling, quota va status backend source-of-truth'ida boshqariladi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lattaputta-outreach
  labels:
    app.kubernetes.io/name: lattaputta-outreach
    app.kubernetes.io/part-of: agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: lattaputta-outreach
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lattaputta-outreach
        app.kubernetes.io/part-of: agents
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: venu-registry

      containers:
        - name: outreach
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/app/outreach"]
          args: ["-config", "/app/configs/config.yaml"]
          envFrom:
            - secretRef:
                name: lattaputta-outreach-env
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
