{{- if and .Values.enabled .Values.postgres.enabled }}
# Chatbotlar uchun YAGONA Postgres. Har do'konga alohida instance ko'tarish
# o'rniga bitta pod + bitta disk; ma'lumot esa DATABASE bo'yicha ajratiladi
# (venu / lattaputta / motiv), shuning uchun bir do'konning bilim bazasi va suhbatlari
# ikkinchisiniki bilan aralashmaydi.
#
# HA emas: ma'lumot bitta node diskida. Yo'qotib bo'lmaydigan narsa saqlashdan
# oldin zaxira (pg_dump cron yoki managed DB) qo'ying.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.postgres.dataClaimName }}
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.postgres.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.postgres.storageSize }}
---
# Databaselar birinchi ishga tushishda yaratiladi. Skript IDEMPOTENT emas —
# initdb uni faqat bo'sh PGDATA da bir marta ishlatadi, keyingi restartlarda
# umuman chaqirilmaydi (mavjud ma'lumot xavfsiz).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgres.initConfigMapName }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
data:
  10-databases.sh: |
    #!/bin/sh
    set -e
    for db in{{ range .Values.postgres.databases }} {{ . }}{{ end }}; do
      if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" | grep -q 1; then
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
          -c "CREATE DATABASE \"$db\" OWNER \"$POSTGRES_USER\";"
      fi
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.postgres.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume: bitta disk ustida ikkita pod ishlamasin
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.postgres.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.postgres.name }}
        app.kubernetes.io/part-of: {{ .Values.partOf }}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ .Values.postgres.secretName }} # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.postgres.dataClaimName }}
        - name: init
          configMap:
            name: {{ .Values.postgres.initConfigMapName }}
            defaultMode: 0o755
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.serviceName }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgres.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ .Values.postgres.name }}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
{{- end }}
