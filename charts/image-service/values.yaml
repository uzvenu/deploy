enabled: false
homePersistence:
  enabled: false
  size: 2Gi
  storageClass: ""
partOf: ""
registrySecretName: ""
image:
  repository: ""
  tag: ""
authSecretName: ""
envSecretName: ""
clientNamespace: ""
clientPodNames: []
# Clients in another cluster. nodePort 0 keeps the service cluster-internal;
# sourceCIDRs are the client addresses the NetworkPolicy admits.
externalClients:
  nodePort: 0
  sourceCIDRs: []
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi
# Explicit opt-in; only the dedicated brand values enable node provisioning.
seccomp:
  enabled: false
  installerImage: busybox:1.37.0
