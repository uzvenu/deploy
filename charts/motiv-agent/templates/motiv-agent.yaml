# Motiv uchun mustaqil Telegram va Instagram Google Sheets Q&A chatboti.
# PostgreSQL/config `motiv-agent-env`da, Telegram token esa faqat
# `motiv-agent-token` Secret'ida saqlanadi; Secret qiymatlari chartga kirmaydi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: motiv-agent
  labels:
    app.kubernetes.io/name: motiv-agent
    app.kubernetes.io/part-of: agents
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: motiv-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: motiv-agent
        app.kubernetes.io/part-of: agents
    spec:
      imagePullSecrets:
        - name: venu-registry
      containers:
        - name: agent
          image: "{{ .Values.motivImage.repository }}:{{ .Values.motivImage.tag }}"
          args: ["-mode", "telegram,instagram"]
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: GOOGLE_CREDENTIALS_FILE
              value: /secrets/google/creds.json
            - name: ALERT_SOURCE
              value: "Motiv"
          envFrom:
            - secretRef:
                name: motiv-agent-env
            - secretRef:
                name: motiv-agent-token
          volumeMounts:
            - name: google-creds
              mountPath: /secrets/google
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
      volumes:
        - name: google-creds
          secret:
            secretName: google-creds
---
apiVersion: v1
kind: Service
metadata:
  name: motiv-agent
  labels:
    app.kubernetes.io/name: motiv-agent
    app.kubernetes.io/part-of: agents
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: motiv-agent
  ports:
    - name: http
      port: 8080
      targetPort: http
