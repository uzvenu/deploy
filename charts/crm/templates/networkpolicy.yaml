{{- if and .Values.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.panel.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.panel.name }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.panel.port }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.api.name }}
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.api.name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }}
        {{- range .Values.networkPolicy.ingestionNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # PostgreSQL and S3 may be cluster-local, managed, or resolve to changing
    # external addresses. Constrain ports without brittle provider CIDRs.
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 443
{{- end }}
