{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.panel.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.panel.name }}
    app.kubernetes.io/component: panel
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  replicas: {{ .Values.panel.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.panel.strategy.maxUnavailable }}
      maxSurge: {{ .Values.panel.strategy.maxSurge }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.panel.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.panel.name }}
        app.kubernetes.io/component: panel
        app.kubernetes.io/part-of: {{ .Values.partOf }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: {{ .Values.registrySecretName }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: panel
          image: "{{ .Values.panel.image.repository }}:{{ .Values.panel.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["nginx"]
          args: ["-c", "/etc/crm/nginx.conf", "-g", "daemon off;"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          ports:
            - name: http
              containerPort: {{ .Values.panel.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.panel.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ .Values.panel.livenessPath }}
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.panel.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-config
              mountPath: /etc/crm
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-config
          configMap:
            name: {{ .Values.panel.name }}-nginx
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.panel.name }}-nginx
  labels:
    app.kubernetes.io/part-of: {{ .Values.partOf }}
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 1024; }
    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      server {
        listen {{ .Values.panel.port }};
        root /usr/share/nginx/html;
        location / { try_files $uri /index.html; }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.panel.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.panel.name }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.panel.name }}
  ports:
    - name: http
      port: {{ .Values.panel.port }}
      targetPort: http
{{- end }}
