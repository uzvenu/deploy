# Venu worker — background jobs (cmd/worker). Same image as the API, runs the
# worker binary instead. Separate Deployment so it scales independently and a
# slow job never starves an HTTP request. No HTTP port, no JWT keys needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: venu-worker
  labels:
    app.kubernetes.io/name: venu-worker
    app.kubernetes.io/part-of: venu
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: venu-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: venu-worker
        app.kubernetes.io/part-of: venu
      # The worker serves /metrics on :9090 (job counters + Go runtime). The
      # port is never exposed via Service/HTTPRoute — cluster-internal only.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
    spec:
      imagePullSecrets:
        - name: venu-registry
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/app/worker"]
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - secretRef:
                name: venu-env
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
