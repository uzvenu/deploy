# Keep true for the current production release. Future example values remain
# false until an operator intentionally creates a separate Argo CD Application.
enabled: true

partOf: venu

image:
  repository: registry.iprogrammer.uz/venu/backend
  tag: bootstrap

registrySecretName: venu-registry

api:
  name: venu-api
  secretName: venu-env
  jwtSecretName: venu-jwt
  storageClaimName: ""
  # Optional out-of-band Secret containing API-only environment variables.
  virtualTryOnSecretName: ""
  agentBaseURL: http://venu-agent.agent.svc.cluster.local:8080

worker:
  name: venu-worker

migration:
  name: venu-migrate

postgres:
  name: postgres
  serviceName: postgres
  secretName: venu-postgres
  dataClaimName: postgres-data
  storageClassName: local-path
  storageSize: 10Gi

backup:
  name: postgres-backup
  claimName: postgres-backups
  storageClassName: local-path
  storageSize: 10Gi
  schedule: "0 22 * * *"
  filePrefix: venu
  retentionDays: 7

route:
  name: venu-api
  hostname: venu-api.iprogrammer.uz
  gatewayName: main-gateway
  gatewayNamespace: default
  agentServiceName: venu-agent
  agentNamespace: agent
