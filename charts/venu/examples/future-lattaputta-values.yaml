# DESIGN EXAMPLE ONLY. No Argo CD Application references this file.
# Keep disabled until the separate namespace, Secrets, database, storage,
# DNS/TLS and data migration have passed the documented cutover gates.
enabled: false

partOf: lattaputta

image:
  repository: registry.iprogrammer.uz/venu/backend
  # Fail-safe immutable SHA sentinel; replace through an explicit promotion.
  tag: "0000000"

registrySecretName: lattaputta-registry

api:
  name: lattaputta-api
  secretName: lattaputta-env
  jwtSecretName: lattaputta-jwt
  storageClaimName: ""
  virtualTryOnSecretName: ""
  agentBaseURL: http://lattaputta-agent.lattaputta-agent.svc.cluster.local:8080

worker:
  name: lattaputta-worker

migration:
  name: lattaputta-migrate

postgres:
  name: lattaputta-postgres
  serviceName: lattaputta-postgres
  secretName: lattaputta-postgres
  dataClaimName: lattaputta-postgres-data
  storageClassName: local-path
  storageSize: 10Gi

backup:
  name: lattaputta-postgres-backup
  claimName: lattaputta-postgres-backups
  storageClassName: local-path
  storageSize: 10Gi
  schedule: "0 22 * * *"
  filePrefix: lattaputta
  retentionDays: 7

route:
  name: lattaputta-api
  # Reserved non-routable placeholder; final domain requires operator approval.
  hostname: api.lattaputta.example.invalid
  gatewayName: main-gateway
  gatewayNamespace: default
  agentServiceName: lattaputta-agent
  agentNamespace: lattaputta-agent
