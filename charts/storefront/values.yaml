# Defaults for the shared storefront chart.
#
# Same rule as charts/marketplace: a default is only allowed when it is the same
# for every brand. The brand's Secret name, hostname and label have no default
# and are declared in templates/validate.yaml, so a brand that forgets one fails
# the render rather than inheriting another brand's.

# Off by default: a storefront only exists because a brand's values turned it on.
enabled: false

# --- required per brand, no defaults -----------------------------------------
#
# partOf              the brand that owns every resource
# registrySecretName  image pull Secret in this brand's namespace
# secretName          the Secret holding BRAND_*, NEXTAUTH_* and BACKEND_URL
# route.hostname      the public storefront hostname, when route.enabled

name: storefront
replicas: 1
# Optional hard placement for this stateless storefront.
nodeSelector: {}
# Optional soft placement. Kubernetes evaluates weights from 1 to 100.
affinity: {}

# Public runtime overrides only. Credentials remain in secretName.
# Explicit env entries take precedence over envFrom (including stale brand assets).
env: {}

# Same image for every brand; the brand is chosen at runtime by BRAND_ID in
# secretName. CD overwrites the tag with the commit SHA.
image:
  repository: registry.iprogrammer.uz/venu/frontend
  tag: bootstrap

service:
  port: 3000

# The admin and seller SPA is embedded in the API binary and uses same-origin
# /api/v1 calls. Route its entry paths and Vite assets directly to that Service.
panel:
  enabled: true
  serviceName: venu-api
  servicePort: 8080

route:
  enabled: true
  name: storefront
  # The cluster's shared gateway: the same one for every brand.
  gatewayName: main-gateway
  gatewayNamespace: default

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi
